name: Build portable Windows release
on:
  push:
    branches: [main]
    paths: ['app/**', 'scripts/**', 'tests/**', 'requirements*.txt', 'VERSION', 'PORTABLE.txt', 'licenses/**', '.github/workflows/portable.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test processing rules
        run: python -m unittest discover -s tests -v
      - name: Build complete portable distribution
        run: python scripts/build_portable.py --accept-runtime-license
      - name: Test the packaged EXE
        run: python scripts/smoke_portable.py dist/Точки
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tochki-Portable-windows-x64
          path: |
            dist/Tochki-Portable-*-win-x64.zip
            dist/SHA256SUMS.txt
          compression-level: 0
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/Tochki-Portable-*-win-x64.zip dist/SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag dist/Tochki-Portable-*-win-x64.zip dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Точки $version Portable · Windows x64" --notes-file RELEASE_NOTES.md --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
