name: PNG design checks
on:
  push:
    branches: [design/vkusvill-png]
permissions:
  contents: read
jobs:
  logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cairosvg
      - name: Rasterize monogram for Pillow
        shell: python
        run: |
          import base64, cairosvg
          png = cairosvg.svg2png(url='app/ui/vv-monogram.svg', output_width=368, output_height=208)
          print('LOGO_PNG=' + base64.b64encode(png).decode())
